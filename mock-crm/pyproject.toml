[project]
name = "mock-crm-mcp"
version = "0.1.0"
description = "Read-only MOCK CRM MCP server (synthetic data) for the SalesFlow demo"
requires-python = ">=3.10"
dependencies = [
    "fastmcp",
]

[project.scripts]
mock-crm-mcp = "mock_crm.server:main"
mock-crm-web = "mock_crm.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_crm"]
