[project]
name = "salesflow-mcp"
version = "0.1.0"
description = "SalesFlow read-only MCP server (synthetic sales data) for IBM Bob"
requires-python = ">=3.10"
dependencies = [
    "fastmcp",
    "python-docx>=1.1.2",
]

[project.scripts]
salesflow-mcp = "salesflow_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salesflow_mcp"]
